<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keypoint ARV — all screens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Keypoint cream/ink/orange, matching src/theme.js */
  :root {
    --bg: #faf6ee; --sunken: #f2ebdd; --ink: #2a2622; --muted: #7a736a;
    --label: #8a857c; --accent: #d95a1f; --border: rgba(42,38,34,0.20);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--sunken); color: var(--ink);
    font: 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  header h1 { font-size: 14px; letter-spacing: .08em; }
  header h1 span { color: var(--accent); }
  header .hint { color: var(--muted); font-size: 12px; }
  header button {
    margin-left: auto; font: inherit; font-size: 12px; letter-spacing: .06em;
    background: var(--ink); color: var(--bg); border: 0; border-radius: 6px;
    padding: 6px 14px; cursor: pointer;
  }
  header button:hover { background: #1f1c19; }
  main {
    flex: 1; display: flex; gap: 16px; padding: 16px 18px;
    overflow-x: auto; align-items: stretch;
  }
  .pane { display: flex; flex-direction: column; gap: 8px; flex: 0 0 400px; }
  .pane h2 {
    font-size: 11px; letter-spacing: .14em; color: var(--label);
    display: flex; align-items: baseline; gap: 8px;
  }
  .pane h2 b { color: var(--ink); }
  .pane h2 .beat { color: var(--accent); }
  .frame {
    flex: 1; min-height: 780px; border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; background: var(--bg);
    box-shadow: 0 1px 3px rgba(42,38,34,0.08);
  }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<header>
  <h1>KEYPOINT · ARV <span>— ALL SCREENS</span></h1>
  <div class="hint">live dev server (localhost:8081) · demo run: 1124 Demo Ave, Alhambra · edits hot-reload every pane</div>
  <!-- blank first: re-setting a src that differs only by #hash is a
       same-document jump, not a reload -->
  <button onclick="document.querySelectorAll('iframe').forEach(f => { f.src = 'about:blank'; setTimeout(() => { f.src = f.dataset.src; }, 60); })">RELOAD ALL</button>
</header>
<main>
  <div class="pane">
    <h2><span class="beat">1</span> <b>ADDRESS</b> · entry + recents</h2>
    <div class="frame"><iframe data-src="http://localhost:8081/" src="http://localhost:8081/"></iframe></div>
  </div>
  <div class="pane">
    <h2><span class="beat">2</span> <b>CURATE</b> · comp testimony + live band</h2>
    <div class="frame"><iframe data-src="http://localhost:8081/#screen=comps" src="http://localhost:8081/#screen=comps"></iframe></div>
  </div>
  <div class="pane">
    <h2><span class="beat">3</span> <b>ANSWER</b> · band / breakeven / tiers</h2>
    <div class="frame"><iframe data-src="http://localhost:8081/#screen=answer" src="http://localhost:8081/#screen=answer"></iframe></div>
  </div>
  <div class="pane">
    <h2><span class="beat">4</span> <b>COMPARE</b> · two saved runs</h2>
    <div class="frame"><iframe data-src="http://localhost:8081/#screen=compare" src="http://localhost:8081/#screen=compare"></iframe></div>
  </div>
</main>
</body>
</html>
